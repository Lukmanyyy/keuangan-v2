# LOCAL DATABASE MIGRATIONS ONLY. Pages dev uses explicit CLI binding flags.
# Do not pass --config to pages dev: Pages does not support custom config paths.
# Cloudflare Pages Git deployments do not use this file.
# Production/preview bindings and variables are configured in the dashboard.
name = "keuangan-v2-local"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-27"
compatibility_flags = ["nodejs_compat"]

[vars]
GOOGLE_CLIENT_ID = ""
GEMINI_MODEL = "gemini-2.5-flash"
OPENAI_MODEL = "gpt-4o-mini"

# Placeholder used only for the local SQLite database, never production.
[[d1_databases]]
binding = "DB"
database_name = "uangku-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# For local R2 tests, add --r2 RECEIPTS_BUCKET to the pages dev command.
