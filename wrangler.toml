name = "keuangan-v2"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-27"
compatibility_flags = ["nodejs_compat"]

[vars]
GOOGLE_CLIENT_ID = ""
GEMINI_MODEL = "gemini-2.5-flash"
OPENAI_MODEL = "gpt-4o-mini"

[env.preview.vars]
GOOGLE_CLIENT_ID = ""
GEMINI_MODEL = "gemini-2.5-flash"
OPENAI_MODEL = "gpt-4o-mini"

# Replace database_id before using Wrangler against production.
# This file is the source of truth for Pages resource bindings; see DEPLOY.md.
[[d1_databases]]
binding = "DB"
database_name = "uangku-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Optional: uncomment after creating a private R2 bucket.
# [[r2_buckets]]
# binding = "RECEIPTS_BUCKET"
# bucket_name = "uangku-receipts"

# Preview deployments must NOT share the production database.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "uangku-db-preview"
database_id = "11111111-1111-1111-1111-111111111111"
migrations_dir = "migrations"

# [[env.preview.r2_buckets]]
# binding = "RECEIPTS_BUCKET"
# bucket_name = "uangku-receipts-preview"
